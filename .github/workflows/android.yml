# Builds the Pluma Android client from the upstream release upstream.env pins.
#
#   check  the patch script's tests and the shell scripts' lint, next to
#          the build, which does not wait for them; signing does;
#   build  fetch (the upstream commit and the submodules it records), patch,
#          compile (native code through ccache, Java through the Gradle
#          build cache), APK with the upstream's test signature;
#   sign   the release key, in the protected "release" environment, for
#          builds for a real server only; the signed APK goes to the site
#          and to the installed apps (the releases service of the server);
#   prune-caches  keeps the newest ccache of the branch.
#
# APKs for a real server leave a job only encrypted for the owner (age):
# artifacts of a public repository are readable by anyone (ADR 0010 of the
# server repository). Development builds stay plain.
#
# The weekly run is a canary: it builds the pinned upstream on a fresh
# runner image, so a broken toolchain or dependency shows up before an
# update is needed.
name: android

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs of the APK (default: PLUMA_ABIS of config/app.env), e.g. arm64-v8a,x86_64"
        required: false
        default: ""
      dev_address:
        description: "A development build for the stand at this IPv4 instead of 10.0.2.2, e.g. the stand machine's Wi-Fi address, or 127.0.0.1 with adb reverse"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # The weekly canary never publishes: it keeps out of the group of main's
  # pushes, so that it cannot take the place of a pending push that would.
  group: android-${{ github.event_name == 'schedule' && 'canary' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Patch script tests
        run: python3 -I ci/patch_test.py -v
      - name: Shell scripts
        run: shellcheck -x ci/*.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      target: ${{ steps.configure.outputs.target }}
      apk: ${{ steps.build.outputs.apk }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/julia* || true
          df -h /
      - name: Fetch upstream and its submodules
        run: ci/fetch-upstream.sh
      - name: Patch
        id: configure
        env:
          SERVER_IPV4: ${{ vars.PLUMA_SERVER_IPV4 }}
          SERVER_PORT: ${{ vars.PLUMA_SERVER_PORT }}
          SERVER_IPV6: ${{ vars.PLUMA_SERVER_IPV6 }}
          RSA_PUBLIC_KEY: ${{ vars.PLUMA_RSA_PUBLIC_KEY }}
          GOOGLE_SERVICES_JSON: ${{ vars.PLUMA_GOOGLE_SERVICES_JSON }}
          ABIS: ${{ inputs.abis }}
          DEV_SERVER_IPV4: ${{ inputs.dev_address }}
          CCACHE: "1"
          # The fourth part of the version, rising with each run: the
          # installed apps take a build as newer by it.
          PLUMA_BUILD: ${{ github.run_number }}
        run: ci/configure.sh
      - name: Preflight
        if: steps.configure.outputs.target == 'server' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          PLUMA_AGE_RECIPIENT: ${{ vars.PLUMA_AGE_RECIPIENT }}
        run: |
          if [[ ! "$PLUMA_AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]; then
            echo "::error::PLUMA_AGE_RECIPIENT is not an age public key; the APK would have nowhere to go (README, Signing)."
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages, ccache, age
        run: ci/setup.sh build
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ hashFiles('upstream.env') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ hashFiles('upstream.env') }}-
            ccache-
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build
        id: build
        env:
          TARGET: ${{ steps.configure.outputs.target }}
        run: |
          ccache --zero-stats
          ci/build.sh "$TARGET"
      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true
      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ hashFiles('upstream.env') }}-${{ github.run_id }}
      - name: Encrypt APK
        if: steps.configure.outputs.target == 'server' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          PLUMA_AGE_RECIPIENT: ${{ vars.PLUMA_AGE_RECIPIENT }}
        run: ci/encrypt.sh out
      - name: Upload APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-build
          path: out/
          retention-days: 3
          if-no-files-found: error

  sign:
    needs: [check, build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.outputs.target == 'server'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: apksigner and age
        run: ci/setup.sh sign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-build
          path: build
      - name: Sign
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.PLUMA_KEYSTORE_B64 }}
          PLUMA_KEYSTORE_PASSWORD: ${{ secrets.PLUMA_KEYSTORE_PASSWORD }}
          PLUMA_KEY_ALIAS: ${{ secrets.PLUMA_KEY_ALIAS }}
          PLUMA_KEY_PASSWORD: ${{ secrets.PLUMA_KEY_PASSWORD }}
          PLUMA_AGE_IDENTITY: ${{ secrets.PLUMA_AGE_IDENTITY }}
          PLUMA_AGE_RECIPIENT: ${{ vars.PLUMA_AGE_RECIPIENT }}
          PLUMA_SIGNING_CERT_SHA256: ${{ vars.PLUMA_SIGNING_CERT_SHA256 }}
          RELEASES_UPLOAD_TOKEN: ${{ secrets.RELEASES_UPLOAD_TOKEN }}
          INPUT_ABIS: ${{ inputs.abis }}
          PLUMA_RELEASES_URL: ${{ vars.PLUMA_RELEASES_URL || 'https://pluma.chat' }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::The release environment has no PLUMA_KEYSTORE_B64; nothing is signed (README, Signing)."
            exit 0
          fi
          if [ -z "$PLUMA_AGE_IDENTITY" ]; then
            echo "::error::The release environment has no PLUMA_AGE_IDENTITY to decrypt the build (README, Signing)."
            exit 1
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/age.key" "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/$APK"' EXIT
          printf '%s\n' "$PLUMA_AGE_IDENTITY" >"$RUNNER_TEMP/age.key"
          age --decrypt --identity "$RUNNER_TEMP/age.key" --output "$RUNNER_TEMP/$APK" "build/$APK.age"
          export PLUMA_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d >"$PLUMA_KEYSTORE"
          mkdir -p signed
          ci/sign.sh "$RUNNER_TEMP/$APK" "signed/$APK"
          # Only a build of main with the ABIs of config/app.env reaches users;
          # one with other ABIs (an emulator build) stays an artifact.
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$INPUT_ABIS" ]; then
            echo "::notice::Built with the ABIs $INPUT_ABIS: signed, not published."
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ -z "$RELEASES_UPLOAD_TOKEN" ] || [ -z "$PLUMA_RELEASES_URL" ]; then
              echo "::error::The release environment has no RELEASES_UPLOAD_TOKEN or PLUMA_RELEASES_URL; the build cannot reach the site (README, Releases)."
              exit 1
            fi
            ci/publish.sh "signed/$APK" "$GITHUB_RUN_NUMBER"
          fi
          ci/encrypt.sh signed
          echo "signed=true" >>"$GITHUB_OUTPUT"
      - name: Upload signed APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluma-android
          path: signed/
          retention-days: 30
          if-no-files-found: error

  prune-caches:
    needs: build
    # A fork's token cannot delete entries.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Older ccache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/prune-caches.sh ccache-
